name: Release 1.21.1-1.0.3

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-1.0.3.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build
        run: gradle build --no-daemon

      - name: Prepare release jar
        run: |
          mkdir -p release
          cp build/libs/apoth_talisman_bag-1.21.1-1.0.3.jar release/apotheosis_amulet_bag-1.21.1-1.0.3.jar

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "1.21.1-1.0.3" \
            "release/apotheosis_amulet_bag-1.21.1-1.0.3.jar" \
            --target "$GITHUB_SHA" \
            --title "Apotheosis Amulet Bag 1.21.1-1.0.3" \
            --notes "Added optional Curios integration. The Amulet Bag can now be equipped in the Curios charm slot, and stored Apotheosis charms remain active while the bag is equipped there. Curios remains optional. No textures, models, recipes, translations, or GUI visuals were changed."
